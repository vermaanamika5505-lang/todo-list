<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <div class="page">

        <!-- Header -->
        <header class="top-bar">

            <div class="brand">
                <div class="logo">
                    <i class="fa-solid fa-check"></i>
                </div>

                <div>
                    <h1>To-Do List <span>♥</span></h1>
                    <p>Small steps make big progress ✨</p>
                </div>
            </div>

            <div class="header-right">

                <button class="theme-btn" id="themeBtn">
                    <i class="fa-solid fa-sun"></i>
                </button>

                <div class="date-box">
                    <i class="fa-regular fa-calendar"></i>
                    <span id="currentDate"></span>
                </div>

            </div>

        </header>


        <!-- Main Area -->
        <main class="main-container">

            <!-- Left Section -->
            <section class="tasks-section">

                <!-- Add Task -->
                <div class="add-task">

                    <div class="input-wrapper">
                        <i class="fa-solid fa-plus"></i>

                        <input
                            type="text"
                            id="taskInput"
                            placeholder="Add a new task..."
                        >
                    </div>

                    <button id="addBtn">
                        Add Task
                    </button>

                </div>


                <!-- Extra Task Information -->
                <div class="task-options">

                    <input type="date" id="taskDate">

                    <input type="time" id="taskTime">

                    <select id="taskCategory">

                        <option value="Personal">Personal</option>
                        <option value="Study">Study</option>
                        <option value="College">College</option>
                        <option value="Health">Health</option>

                    </select>

                </div>


                <!-- Filters -->
                <div class="filter-row">

                    <div class="filters">

                        <button class="filter active" data-filter="all">
                            All
                            <span id="allCount">0</span>
                        </button>

                        <button class="filter" data-filter="pending">
                            Pending
                            <span id="pendingCount">0</span>
                        </button>

                        <button class="filter" data-filter="completed">
                            Completed
                            <span id="completedCount">0</span>
                        </button>

                    </div>


                    <div class="sort-area">

                        <label for="sortSelect">
                            Sort by
                        </label>

                        <select id="sortSelect">

                            <option value="newest">
                                Date (Newest)
                            </option>

                            <option value="oldest">
                                Date (Oldest)
                            </option>

                            <option value="az">
                                A - Z
                            </option>

                            <option value="completed">
                                Completed First
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Tasks -->
                <div id="taskList" class="task-list"></div>

            </section>


            <!-- Right Sidebar -->
            <aside class="sidebar">

                <!-- Quote -->
                <div class="quote-card">

                    <div class="quote-icon">
                        🌱
                    </div>

                    <p>
                        Discipline today<br>
                        builds the life you want<br>
                        tomorrow ♡
                    </p>

                </div>


                <!-- Progress -->
                <div class="side-card">

                    <h2>
                        <i class="fa-solid fa-bullseye"></i>
                        Progress
                    </h2>

                    <div class="progress-area">

                        <div class="circle-progress">

                            <div class="circle-inner">
                                <strong id="progressPercent">
                                    0%
                                </strong>
                            </div>

                        </div>

                        <div>
                            <strong id="progressText">
                                0 of 0 tasks
                            </strong>

                            <p>completed</p>
                        </div>

                    </div>

                    <div class="progress-bar">
                        <div id="progressFill"></div>
                    </div>

                </div>


                <!-- Quick Filters -->
                <div class="side-card">

                    <h2>
                        <i class="fa-solid fa-filter"></i>
                        Quick Filters
                    </h2>

                    <div class="quick-filter active" data-filter="all">

                        <span>
                            <i class="fa-solid fa-list"></i>
                            All Tasks
                        </span>

                        <b id="sideAll">0</b>

                    </div>


                    <div class="quick-filter" data-filter="pending">

                        <span>
                            <i class="fa-regular fa-clock"></i>
                            Pending
                        </span>

                        <b id="sidePending">0</b>

                    </div>


                    <div class="quick-filter" data-filter="completed">

                        <span>
                            <i class="fa-solid fa-circle-check"></i>
                            Completed
                        </span>

                        <b id="sideCompleted">0</b>

                    </div>


                    <button class="clear-btn" id="clearBtn">

                        <i class="fa-regular fa-trash-can"></i>

                        Clear All

                    </button>

                </div>

            </aside>

        </main>


        <!-- Footer -->
        <footer>

            <span></span>

            <p>
                Better Plans
                <b>✦</b>
                Brighter Days
                ♡
            </p>

            <span></span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
